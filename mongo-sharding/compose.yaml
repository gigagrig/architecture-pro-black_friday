name: mongo-sharding

services:
  configsvr1:
    image: mongo:7.0
    command:
      - mongod
      - --configsvr
      - --replSet
      - configReplSet
      - --bind_ip_all
      - --port
      - "27017"
    volumes:
      - configsvr1_data:/data/db

  shard1:
    image: mongo:7.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1ReplSet
      - --bind_ip_all
      - --port
      - "27018"
    volumes:
      - shard1_data:/data/db

  shard2:
    image: mongo:7.0
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2ReplSet
      - --bind_ip_all
      - --port
      - "27018"
    volumes:
      - shard2_data:/data/db

  mongos:
    image: mongo:7.0
    restart: unless-stopped
    depends_on:
      - configsvr1
      - shard1
      - shard2
    command:
      - mongos
      - --configdb
      - configReplSet/configsvr1:27017
      - --bind_ip_all
      - --port
      - "27017"

  pymongo_api:
    image: kazhem/pymongo_api:1.0.0
    restart: unless-stopped
    depends_on:
      - mongos
    volumes:
      - ./api_app/app.py:/app/app.py:ro
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  configsvr1_data:
  shard1_data:
  shard2_data:
